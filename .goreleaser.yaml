# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: mewroute

before:
  hooks:
    - go mod tidy

builds:
  - id: mewroute
    main: ./cmd/mewroute
    binary: mewroute
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mewisme
    name: mewroute

dockers_v2:
  - id: mewroute
    ids:
      - mewroute
    images:
      - ghcr.io/mewisme/mewroute
      - mewisme/mewroute
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    flags:
      - "--provenance=false"
    labels:
      "org.opencontainers.image.title": mewroute
      "org.opencontainers.image.description": Lightweight configurable static file router
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
